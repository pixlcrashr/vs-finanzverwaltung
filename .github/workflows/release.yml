name: "Release"
run-name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout repository

      - name: Login to ${{ vars.REGISTRY_URL }} Docker registry
        run: echo "${{ secrets.REGISTRY_CREDENTIALS }}" | docker login --password-stdin -u "${{ secrets.REGISTRY_USER }}"

      - name: Build Docker image
        run: docker build --build-arg VERSION="${{ github.ref_name }}" -t ${{ vars.IMAGE }}:${{ github.ref_name }} .

      - name: Tag Docker image
        run: docker tag ${{ vars.IMAGE }}:${{ github.ref_name }} ${{ vars.IMAGE }}:latest

      - name: Push Docker image version
        run: docker push ${{ vars.IMAGE }}:${{ github.ref_name }}

      - name: Push Docker image latest
        run: docker push ${{ vars.IMAGE }}:latest

      - name: Logout from ${{ vars.REGISTRY_URL }} Docker registry
        run: docker logout
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
    steps:
      - uses: softprops/action-gh-release@v2
        name: Create GitHub Release
        with:
          body: |
            Docker image: `${{ vars.IMAGE }}:${{ github.ref_name }}`
          tag_name: ${{ github.ref_name }}
  update-pages:
    name: Update Pages
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.3
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        name: Checkout repository

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        working-directory: docs
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://pixlcrashr.github.io/vsfv/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4