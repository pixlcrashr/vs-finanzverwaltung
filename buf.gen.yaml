version: v2

managed:
  enabled: true

plugins:
  - local: protoc-gen-go
    out: ./pkg/grpc/gen
    opt: module=github.com/pixlcrashr/vsfv/pkg/grpc/gen

  - local: protoc-gen-go-grpc
    out: ./pkg/grpc/gen
    opt:
      - module=github.com/pixlcrashr/vsfv/pkg/grpc/gen
      - require_unimplemented_servers=false

  - local: protoc-gen-go-aip
    out: ./pkg/grpc/gen
    opt: module=github.com/pixlcrashr/vsfv/pkg/grpc/gen

  - local: protoc-gen-doc
    out: ./docs/api/
    opt: html,proto.html
  
  - local: protoc-gen-grpc-gateway
    out: ./pkg/grpc/gen
    opt:
      - module=github.com/pixlcrashr/vsfv/pkg/grpc/gen
      - generate_unbound_methods=true

  - local: protoc-gen-openapiv2
    out: ./
    opt:
      - allow_merge=true
      - json_names_for_fields=false
      - merge_file_name=openapi
      - output_format=yaml