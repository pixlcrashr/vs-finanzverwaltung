server:
  # Address and port the HTTP server listens on.
  addr: "127.0.0.1:8080"

database:
  # PostgreSQL connection string.
  url: "postgres://user:password@localhost:5432/vsfv?sslmode=disable"

auth:
  # Random secret used to sign session tokens. Generate with: openssl rand -hex 32
  secret: "change-me"
  gitlab:
    # GitLab OAuth2 application credentials.
    client-id: "your-gitlab-client-id"
    client-secret: "your-gitlab-client-secret"
    # Base URL of the GitLab instance used as the OAuth2 issuer.
    issuer: "https://gitlab.com"

html2pdf:
  # URL of the html2pdf conversion service.
  url: "http://127.0.0.1:8082"

app:
  organisation-name: "Your Organisation Name"
  # Displayed in API responses and the OpenAPI spec. Defaults to "dev".
  version: "1.0.0"

cors:
  # Enable CORS middleware. Defaults to false.
  enabled: false
  # Allowed origins. Defaults to ["*"].
  allow-origins:
    - "*"
  # Allowed HTTP methods. Defaults to common methods.
  allow-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  # Allowed request headers.
  allow-headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  # Whether to allow credentials (cookies, auth headers).
  allow-credentials: false
  # Preflight cache duration in seconds.
  max-age: 300
