swagger: "2.0"
info:
  title: VSFV API
  version: v1
  contact:
    name: pixlcrashr
    url: https://pixlcrashr.dev
    email: info@pixlcrashr.dev
tags:
  - name: AccountService
    description: AccountService manages budget accounts in the chart of accounts.
  - name: AccountGroupService
    description: AccountGroupService manages named groupings of budget accounts.
  - name: AccountGroupAssignmentService
    description: AccountGroupAssignmentService manages account memberships within account groups.
  - name: BudgetService
    description: BudgetService manages financial budgets.
  - name: BudgetAccountValueService
    description: BudgetAccountValueService manages per-account value assignments within a budget.
  - name: BudgetActualAccountValueService
    description: |-
      BudgetActualAccountValueService provides read-only access to the computed
      actual monetary values per budget account. Values are derived from the sum of
      TransactionAccountAssignment values for transactions within the budget period.
      All resources in this service are server-computed and immutable.
  - name: BudgetRevisionService
    description: |-
      BudgetRevisionService manages read-only revision history for budgets.
      Revisions are created on demand and capture the full set of
      BudgetAccountValues at the time of creation. Revisions are immutable.
  - name: BudgetRevisionAccountValueService
    description: |-
      BudgetRevisionAccountValueService provides read-only access to the
      per-account values captured within a BudgetRevision. All resources in this
      service are immutable and server-managed.
  - name: GroupService
    description: GroupService manages groups and their per-organization permission policies.
  - name: LedgerAccountService
    description: |-
      LedgerAccountService manages ledger accounts for bookkeeping.
      Accounts are auto-created during import; only Get, List, Update, Delete are exposed.
  - name: LedgerYearService
    description: LedgerYearService manages fiscal/economic years within an organization.
  - name: OrganizationService
    description: OrganizationService manages organizations.
  - name: ReportService
    description: |-
      ReportService manages generated report instances.
      Note: report file download is handled exclusively by the Huma HTTP API.
  - name: ReportTemplateService
    description: ReportTemplateService manages Handlebars templates used for report generation.
  - name: TransactionService
    description: TransactionService manages financial transactions.
  - name: TransactionAssignmentService
    description: TransactionAssignmentService manages transaction assignments to budget accounts.
  - name: UserService
    description: |-
      UserService provides a read-only administrative view of users.
      Users are created exclusively through the SSO/OAuth2 flow.
  - name: UserIdentityService
    description: |-
      UserIdentityService provides a read-only view of the OAuth2 / SSO
      connections linked to a user. No credentials are ever returned.
  - name: UserSettingsService
    description: UserSettingsService manages per-user application preferences.
host: test.pixlcrashr.dev
basePath: /api
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/groups:
    get:
      summary: |-
        Lists groups with pagination.
        Authorization:
          Scope: groups:read
          Permission: PERMISSION_GROUPS_READ
          Domain: global
      operationId: GroupService_ListGroups
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListGroupsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of groups to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListGroups call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name.
          in: query
          required: false
          type: string
        - name: order_by
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - GroupService
    post:
      summary: |-
        Creates a new group.
        Authorization:
          Scope: groups:write
          Permission: PERMISSION_GROUPS_CREATE
          Domain: global
      operationId: GroupService_CreateGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: group
          description: The group to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Group'
        - name: group_id
          description: |-
            The ID to use for the group. If not provided, a system-generated UUID
            will be used. Must be unique across all groups.
          in: query
          required: false
          type: string
      tags:
        - GroupService
  /v1/organizations:
    get:
      summary: |-
        Lists organizations with pagination.
        Authorization:
          Scope: organizations:read
          Permission: PERMISSION_ORGANIZATIONS_READ
          Domain: global
      operationId: OrganizationService_ListOrganizations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOrganizationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of organizations to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListOrganizations call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name.
            Example: "display_name=\"Acme\"".
          in: query
          required: false
          type: string
        - name: order_by
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - OrganizationService
    post:
      summary: |-
        Creates a new organization.
        Authorization:
          Scope: organizations:write
          Permission: PERMISSION_ORGANIZATIONS_CREATE
          Domain: global
      operationId: OrganizationService_CreateOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Organization'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          description: The organization to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Organization'
        - name: organization_id
          description: |-
            The ID to use for the organization. If not provided, a system-generated
            UUID will be used. Must be unique across all organizations.
          in: query
          required: false
          type: string
      tags:
        - OrganizationService
  /v1/organizations:checkId:
    post:
      summary: |-
        Checks whether an organization ID (slug) is available for use.
        Authorization:
          Scope: organizations:read
          Permission: PERMISSION_ORGANIZATIONS_READ
          Domain: global
      operationId: OrganizationService_CheckOrganizationId
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CheckOrganizationIdResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CheckOrganizationIdRequest'
      tags:
        - OrganizationService
  /v1/users:
    get:
      summary: |-
        Lists users with pagination.
        Authorization:
          Scope: users:read
          Permission: PERMISSION_USERS_READ
          Domain: global
      operationId: UserService_ListUsers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListUsersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_size
          description: |-
            Maximum number of users to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: page_token
          description: A page token from a previous ListUsers call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name, email, is_active.
          in: query
          required: false
          type: string
        - name: order_by
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - UserService
  /v1/{account.name}:
    patch:
      summary: |-
        Updates an existing account.
        Authorization:
          Scope: accounts:write
          Permission: PERMISSION_ACCOUNTS_UPDATE
          Domain: organization-scoped
      operationId: AccountService_UpdateAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Account'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account.name
          description: |-
            The resource name of the account.
            Format: organizations/{organization}/accounts/{account}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/accounts/[^/]+
        - name: account
          description: The account to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the account.
                readOnly: true
              parent_account:
                type: string
                title: |-
                  The resource name of the parent account, if any.
                  Format: organizations/{organization}/accounts/{account}
              display_name:
                type: string
                description: Human-readable account name.
              display_code:
                type: string
                description: Short account code.
              display_description:
                type: string
                description: Optional free-text description.
              is_container:
                type: boolean
                description: |-
                  Whether this account is a container account (cannot hold values directly).
                  Immutable after creation.
              is_archived:
                type: boolean
                description: Whether the account is archived (soft-deleted).
                readOnly: true
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The account to update.
            required:
              - display_name
              - display_code
      tags:
        - AccountService
  /v1/{account_group.name}:
    patch:
      summary: |-
        Updates an existing account group.
        Authorization:
          Scope: accountGroups:write
          Permission: PERMISSION_ACCOUNT_GROUPS_UPDATE
          Domain: organization-scoped
      operationId: AccountGroupService_UpdateAccountGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AccountGroup'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account_group.name
          description: |-
            The resource name of the account group.
            Format: organizations/{organization}/accountGroups/{account_group}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/accountGroups/[^/]+
        - name: account_group
          description: The account group to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the account group.
                readOnly: true
              display_name:
                type: string
                description: Human-readable account group name.
              display_description:
                type: string
                description: Optional free-text description.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The account group to update.
            required:
              - display_name
      tags:
        - AccountGroupService
  /v1/{account_value.name}:
    patch:
      summary: |-
        Updates an existing budget account value.
        Authorization:
          Scope: budgets:write
          Permission: PERMISSION_BUDGETS_UPDATE
          Domain: organization-scoped
      operationId: BudgetAccountValueService_UpdateBudgetAccountValue
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1BudgetAccountValue'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account_value.name
          description: |-
            The resource name of the budget account value.
            Format: organizations/{organization}/budgets/{budget}/accountValues/{account_value}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/budgets/[^/]+/accountValues/[^/]+
        - name: account_value
          description: The budget account value to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the budget account value.
                readOnly: true
              budget:
                type: string
                title: |-
                  The resource name of the parent budget.
                  Format: organizations/{organization}/budgets/{budget}
                readOnly: true
              account_id:
                type: string
                description: The UUID of the account this value is assigned to.
              value:
                $ref: '#/definitions/v1Decimal'
                description: The target monetary value assigned to the account for this budget.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The budget account value to update.
            required:
              - account_id
              - value
        - name: allow_missing
          description: |-
            If set to true, and the resource is not found, a new resource will be
            created. In this situation, update_mask is ignored.
          in: query
          required: false
          type: boolean
      tags:
        - BudgetAccountValueService
  /v1/{assignment.name}:
    patch:
      summary: |-
        Updates an existing assignment.
        Authorization:
          Scope: accountGroups:write
          Permission: PERMISSION_ACCOUNT_GROUPS_UPDATE
          Domain: organization-scoped
      operationId: AccountGroupAssignmentService_UpdateAccountGroupAssignment
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AccountGroupAssignment'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: assignment.name
          description: |-
            The resource name of the assignment.
            Format: organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/accountGroups/[^/]+/assignments/[^/]+
        - name: assignment
          description: The assignment to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the assignment.
                readOnly: true
              account_group:
                type: string
                title: |-
                  The resource name of the parent account group.
                  Format: organizations/{organization}/accountGroups/{account_group}
                readOnly: true
              account_id:
                type: string
                description: The UUID of the assigned account.
              negate:
                type: boolean
                description: If true, this account is excluded (negated) from the group aggregate.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The assignment to update.
            required:
              - account_id
      tags:
        - AccountGroupAssignmentService
  /v1/{budget.name}:
    patch:
      summary: |-
        Updates an existing budget.
        Authorization:
          Scope: budgets:write
          Permission: PERMISSION_BUDGETS_UPDATE
          Domain: organization-scoped
      operationId: BudgetService_UpdateBudget
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Budget'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: budget.name
          description: |-
            The resource name of the budget.
            Format: organizations/{organization}/budgets/{budget}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/budgets/[^/]+
        - name: budget
          description: The budget to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the budget.
                readOnly: true
              display_name:
                type: string
                description: Human-readable budget name.
              display_description:
                type: string
                description: Optional free-text description.
              is_closed:
                type: boolean
                description: Whether the budget is closed (no further modifications allowed).
                readOnly: true
              period_start:
                $ref: '#/definitions/typeDate'
                description: Budget period start date.
              period_end:
                $ref: '#/definitions/typeDate'
                description: Budget period end date.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The budget to update.
            required:
              - display_name
              - period_start
              - period_end
      tags:
        - BudgetService
  /v1/{group.name}:
    patch:
      summary: |-
        Updates an existing group.
        Authorization:
          Scope: groups:write
          Permission: PERMISSION_GROUPS_UPDATE
          Domain: global
      operationId: GroupService_UpdateGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: group.name
          description: |-
            The resource name of the group.
            Format: groups/{group}
          in: path
          required: true
          type: string
          pattern: groups/[^/]+
        - name: group
          description: The group to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the group.
                readOnly: true
              display_name:
                type: string
                description: Human-readable group name.
              display_description:
                type: string
                description: Optional free-text description.
              organization_policies:
                type: array
                items:
                  type: object
                  $ref: '#/definitions/v1GroupOrganizationPolicy'
                description: |-
                  Per-organization permission policies for this group.
                  Each entry associates a distinct organization with a set of permissions.
                  Multiple entries for the same organization are not allowed.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The group to update.
            required:
              - display_name
      tags:
        - GroupService
  /v1/{ledger_account.name}:
    patch:
      summary: |-
        Updates an existing ledger account (e.g., display name).
        Authorization:
          Scope: ledgerAccount:write
          Permission: PERMISSION_LEDGER_ACCOUNT_UPDATE
          Domain: organization-scoped
      operationId: LedgerAccountService_UpdateLedgerAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LedgerAccount'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ledger_account.name
          description: |-
            The resource name of the ledger account.
            Format: organizations/{organization}/ledgerAccounts/{ledger_account}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/ledgerAccounts/[^/]+
        - name: ledger_account
          description: The ledger account to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the ledger account.
                readOnly: true
              code:
                type: string
                description: Unique account code (e.g., from the Kontenrahmen).
              account_type:
                $ref: '#/definitions/v1AccountType'
                description: The type of account for transaction interpretation.
              display_name:
                type: string
                description: Human-readable name.
              display_description:
                type: string
                description: Optional free-text description.
              update_time:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              create_time:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
              etag:
                type: string
                description: Entity tag for optimistic concurrency control.
                readOnly: true
            title: The ledger account to update.
            required:
              - code
              - account_type
      tags:
        - LedgerAccountService
  /v1/{name_10}:
    get:
      summary: |-
        Gets a single ledger year by resource name.
        Authorization:
          Scope: ledgerYear:read
          Permission: PERMISSION_LEDGER_YEAR_READ
          Domain: organization-scoped
      operationId: LedgerYearService_GetLedgerYear
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LedgerYear'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name_10
          description: |-
            The resource name of the ledger year.
            Format: organizations/{organization}/ledgerYears/{ledger_year}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/ledgerYears/[^/]+
      tags:
        - LedgerYearService
    delete:
      summary: |-
        Permanently deletes a transaction.
        Authorization:
          Scope: transactions:write
          Permission: PERMISSION_TRANSACTIONS_DELETE
          Domain: organization-scoped
      operationId: TransactionService_DeleteTransaction
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name_10
          description: |-
            The resource name of the transaction.
            Format: organizations/{organization}/transactions/{transaction}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/transactions/[^/]+
      tags:
        - TransactionService
  /v1/{name_11}:
    get:
      summary: |-
        Gets a single organization by resource name.
        Authorization:
          Scope: organizations:read
          Permission: PERMISSION_ORGANIZATIONS_READ
          Domain: global
      operationId: OrganizationService_GetOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Organization'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name_11
          description: |-
            The resource name of the organization.
            Format: organizations/{organization}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+
      tags:
        - OrganizationService
  /v1/{name_12}:
    get:
      summary: |-
        Gets report metadata by resource name.
        Authorization:
          Scope: reports:read
          Permission: PERMISSION_REPORTS_READ
          Domain: organization-scoped
      operationId: ReportService_GetReport
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Report'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name_12
          description: |-
            The resource name of the report.
            Format: organizations/{organization}/reports/{report}
          in: path
          required: true
          type: string
          pattern: organizations/[^/]+/reports/[^/]+
      tags:
        - ReportService
  /v1/{name_13}:
    get:
      summary: |-
        Gets a single report template by resource name.
        Authorization:
          Scope: reportTemplates:read
          Permission: PERMISSION_REPORT_TEMPLATES_READ
          Domain: organization-scoped
      operationId: ReportTemplateService_GetReportTemplate
      responses:
        "200":
          description: A successful response.
