      tags:
        - ImportSourceService
  /v1/{name_10}:
    get:
      summary: Gets a single transaction account by resource name.
      operationId: TransactionAccountService_GetTransactionAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1TransactionAccount'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name_10
          description: |-
            The resource name of the transaction account.
            Format: transactionAccounts/{transaction_account}
          in: path
          required: true
