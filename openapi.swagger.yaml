swagger: "2.0"
info:
  title: VSFV API
  version: v1
  contact:
    name: pixlcrashr
    url: https://pixlcrashr.dev
    email: info@pixlcrashr.dev
tags:
  - name: AccountService
  - name: AccountGroupService
  - name: AccountGroupAssignmentService
  - name: BudgetService
  - name: BudgetTagService
  - name: ImportSourceService
  - name: ImportSourcePeriodService
  - name: ReportService
  - name: ReportTemplateService
  - name: TransactionService
  - name: TransactionAccountService
  - name: TransactionAccountAssignmentService
host: test.pixlcrashr.dev
basePath: /api
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/accountGroups:
    get:
      summary: Lists account groups with pagination.
      operationId: AccountGroupService_ListAccountGroups
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAccountGroupsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: |-
            Maximum number of account groups to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: A page token from a previous ListAccountGroups call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name.
            Example: "display_name=\"Overhead\"".
          in: query
          required: false
          type: string
        - name: orderBy
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - AccountGroupService
    post:
      summary: Creates a new account group.
      operationId: AccountGroupService_CreateAccountGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AccountGroup'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: accountGroup
          description: The account group to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1AccountGroup'
      tags:
        - AccountGroupService
  /v1/accounts:
    get:
      summary: Lists accounts with pagination.
      operationId: AccountService_ListAccounts
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAccountsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: |-
            Maximum number of accounts to return. The service may return fewer.
            If unspecified, at most 20 accounts will be returned. Maximum value is 100;
            values above 100 will be coerced to 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: |-
            A page token from a previous ListAccounts call.
            Provide this to retrieve the next page.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name, display_code, is_archived.
            Example: "is_archived=true" or "display_name:foo".
          in: query
          required: false
          type: string
        - name: showDeleted
          description: |-
            If true, soft-deleted (archived) accounts are included in results.
            See AIP-132 for soft-delete guidance.
          in: query
          required: false
          type: boolean
        - name: orderBy
          description: Order by expression (e.g. "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - AccountService
    post:
      summary: Creates a new account.
      operationId: AccountService_CreateAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Account'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account
          description: The account to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Account'
      tags:
        - AccountService
  /v1/accounts:listNested:
    get:
      summary: Lists all root accounts with their full nested subtrees (custom method).
      operationId: AccountService_ListNestedAccounts
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListNestedAccountsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: is_archived.
            Example: "is_archived=true".
          in: query
          required: false
          type: string
      tags:
        - AccountService
  /v1/budgets:
    get:
      summary: Lists budgets with pagination.
      operationId: BudgetService_ListBudgets
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListBudgetsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: |-
            Maximum number of budgets to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: A page token from a previous ListBudgets call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: display_name, is_closed.
            Example: "is_closed=false" or "display_name=\"FY2025\"".
          in: query
          required: false
          type: string
        - name: showDeleted
          description: If true, closed budgets are included in results.
          in: query
          required: false
          type: boolean
        - name: orderBy
          description: Order by expression (e.g. "display_name", "period_start desc").
          in: query
          required: false
          type: string
      tags:
        - BudgetService
    post:
      summary: Creates a new budget.
      operationId: BudgetService_CreateBudget
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Budget'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: budget
          description: The budget to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Budget'
      tags:
        - BudgetService
