  /v1/{account.name}:
    patch:
      summary: Updates an existing account.
      operationId: AccountService_UpdateAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Account'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: account.name
          description: |-
            The resource name of the account.
            Format: accounts/{account}
          in: path
          required: true
          type: string
          pattern: accounts/[^/]+
        - name: account
          description: The account to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the account.
                readOnly: true
              parentAccount:
                type: string
                title: |-
                  The resource name of the parent account, if any.
                  Format: accounts/{account}
              displayName:
                type: string
                description: Human-readable account name.
              displayCode:
                type: string
                description: Short account code.
              displayDescription:
                type: string
                description: Optional free-text description.
              isContainer:
                type: boolean
                description: |-
                  Whether this account is a container account (cannot hold values directly).
                  Immutable after creation.
              isArchived:
                type: boolean
                description: Whether the account is archived (soft-deleted).
                readOnly: true
              updateTime:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
            title: The account to update.
            required:
              - displayName
              - displayCode
      tags:
        - AccountService
  /v1/{accountGroup.name}:
    patch:
      summary: Updates an existing account group.
