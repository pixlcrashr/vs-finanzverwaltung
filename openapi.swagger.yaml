              displayDescription:
                type: string
                description: Optional free-text description.
              periodStart:
                $ref: '#/definitions/typeDate'
                description: Period start date for this import source.
              updateTime:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
            title: The import source to update.
            required:
