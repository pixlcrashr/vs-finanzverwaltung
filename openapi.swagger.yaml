      tags:
        - ReportService
  /v1/transactionAccounts:
    get:
      summary: Lists transaction accounts with pagination.
      operationId: TransactionAccountService_ListTransactionAccounts
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTransactionAccountsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: |-
            Maximum number of accounts to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: A page token from a previous ListTransactionAccounts call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: import_source_id, code, display_name.
            Example: "import_source_id=\"<uuid>\"" or "code:\"IBAN\"".
          in: query
          required: false
          type: string
        - name: orderBy
          description: Order by expression (e.g. "code", "display_name", "create_time desc").
          in: query
          required: false
          type: string
      tags:
        - TransactionAccountService
    post:
      summary: Creates a new transaction account.
      operationId: TransactionAccountService_CreateTransactionAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1TransactionAccount'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: transactionAccount
          description: The transaction account to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1TransactionAccount'
      tags:
        - TransactionAccountService
  /v1/transactions:
    get:
      summary: Lists transactions with keyset pagination and optional filters.
      operationId: TransactionService_ListTransactions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTransactionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: |-
            Maximum number of transactions to return. The service may return fewer.
            If unspecified, at most 20 are returned. Maximum value is 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: A page token from a previous ListTransactions call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Filter expression conforming to AIP-160.
            Supported fields: credit_transaction_account_id, debit_transaction_account_id,
            booked_at, document_date, amount.
            Example: "credit_transaction_account_id=\"<uuid>\" AND booked_at>=\"2025-01-01T00:00:00Z\"".
          in: query
          required: false
          type: string
        - name: orderBy
          description: Order by expression (e.g. "booked_at desc", "amount").
          in: query
          required: false
          type: string
      tags:
        - TransactionService
    post:
      summary: Creates a new transaction.
      operationId: TransactionService_CreateTransaction
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Transaction'
        default:
