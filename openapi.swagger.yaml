          schema:
            $ref: '#/definitions/v1ReportTemplate'
      tags:
        - ReportTemplateService
  /v1/reports:
    get:
      summary: Lists reports with pagination.
      operationId: ReportService_ListReports
      responses:
        "200":
          description: A successful response.
