                description: The UUID of the account group.
                readOnly: true
              displayName:
                type: string
                description: Human-readable account group name.
              displayDescription:
                type: string
                description: Optional free-text description.
              updateTime:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
