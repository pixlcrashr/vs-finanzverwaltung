  /v1/{assignment.name_1}:
    patch:
      summary: Updates an existing assignment.
      operationId: TransactionAccountAssignmentService_UpdateTransactionAccountAssignment
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1TransactionAccountAssignment'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: assignment.name_1
          description: |-
            The resource name of the assignment.
            Format: transactions/{transaction}/assignments/{assignment}
          in: path
          required: true
          type: string
          pattern: transactions/[^/]+/assignments/[^/]+
        - name: assignment
          description: The assignment to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the assignment.
                readOnly: true
              transaction:
                type: string
                title: |-
                  The resource name of the parent transaction.
                  Format: transactions/{transaction}
                readOnly: true
              accountId:
                type: string
                description: UUID of the budget account this portion of the transaction is assigned to.
              value:
                type: string
                description: The decimal value assigned to this account (e.g. "50.00").
              updateTime:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
            title: The assignment to update.
            required:
              - accountId
              - value
      tags:
        - TransactionAccountAssignmentService
  /v1/{assignment.name}:
    patch:
      summary: Updates an existing assignment.
