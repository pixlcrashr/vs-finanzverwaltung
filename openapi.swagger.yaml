  v1Report:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the report.
          Format: organizations/{organization}/reports/{report}
        readOnly: true
      uid:
        type: string
        description: The UUID of the report.
        readOnly: true
      display_name:
        type: string
        description: Human-readable name.
      report_template_id:
        type: string
        description: UUID of the report template used to generate this report.
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: |-
      Report is a generated report instance produced from a ReportTemplate.
      The rendered binary content is served exclusively via the Huma HTTP API
      (GET /v1/organizations/{organization}/reports/{reportId}:download) and is intentionally excluded here.
    required:
      - display_name
      - report_template_id
  v1ReportTemplate:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the report template.
          Format: organizations/{organization}/reportTemplates/{report_template}
        readOnly: true
      uid:
        type: string
        description: The UUID of the report template.
        readOnly: true
      display_name:
        type: string
        description: Human-readable name.
      template:
        type: string
        description: The Handlebars template content.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: ReportTemplate is a Handlebars template used to render reports.
    required:
      - display_name
      - template
  v1Transaction:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the transaction.
          Format: organizations/{organization}/transactions/{transaction}
        readOnly: true
      uid:
        type: string
        description: The UUID of the transaction.
        readOnly: true
      credit_ledger_account:
        type: string
        title: |-
          Resource name of the credit ledger account.
          Format: organizations/{organization}/ledgerAccounts/{ledger_account}
      debit_ledger_account:
        type: string
        title: |-
          Resource name of the debit ledger account.
          Format: organizations/{organization}/ledgerAccounts/{ledger_account}
      amount:
        $ref: '#/definitions/v1Decimal'
        description: Transaction amount.
      description:
        type: string
        description: Human-readable transaction description.
      reference:
        type: string
        description: External reference identifier.
      booked_at:
        type: string
        format: date-time
        description: Booking date.
      document_date:
        type: string
        format: date-time
        description: Document date.
      document_id:
        type: string
        description: Optional document ID.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: Transaction represents a financial transaction between two transaction accounts.
    required:
      - credit_ledger_account
      - debit_ledger_account
      - amount
      - booked_at
      - document_date
  v1TransactionAssignment:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the transaction assignment.
          Format: organizations/{organization}/transactions/{transaction}/assignments/{assignment}
        readOnly: true
      uid:
        type: string
        description: The UUID of the transaction assignment.
        readOnly: true
      transaction:
        type: string
        title: |-
          Resource name of the parent transaction.
          Format: organizations/{organization}/transactions/{transaction}
      account:
        type: string
        title: |-
          Resource name of the account this transaction is assigned to.
          Format: organizations/{organization}/accounts/{account}
      value:
        $ref: '#/definitions/v1Decimal'
        description: The assigned value amount.
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp.
        readOnly: true
    description: |-
      TransactionAssignment represents the assignment of a transaction to a budget account.
      This splits transaction amounts across accounts for budgeting purposes.
    required:
      - transaction
      - account
      - value
  v1UpdateBudgetAccountValueRequest:
    type: object
    properties:
      account_value:
        $ref: '#/definitions/v1BudgetAccountValue'
        description: The budget account value to update.
      update_mask:
        type: string
        description: The list of fields to update.
      allow_missing:
        type: boolean
        description: |-
          If set to true, and the resource is not found, a new resource will be
          created. In this situation, update_mask is ignored.
    required:
      - account_value
  v1User:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the user.
          Format: users/{user}
        readOnly: true
      uid:
        type: string
        description: The UUID of the user.
        readOnly: true
      display_name:
        type: string
        description: Primary display name (derived from SSO provider at last login).
        readOnly: true
      email:
        type: string
        description: Primary e-mail address (derived from SSO provider at last login).
        readOnly: true
      is_active:
        type: boolean
        description: Whether the user account is active.
        readOnly: true
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Creation timestamp (first SSO login).
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: |-
      User represents a human actor that can log in via SSO.
      Users are created exclusively through the SSO/OAuth2 flow; this service
      exposes a read-only view for administration purposes.
  v1UserIdentity:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the identity.
          Format: users/{user}/identities/{identity}
        readOnly: true
      uid:
        type: string
        description: The UUID of the identity record.
        readOnly: true
      provider:
        type: string
        description: The OAuth2 provider identifier (e.g. "google", "github", "azure").
        readOnly: true
      provider_subject:
        type: string
        description: |-
          The subject identifier as issued by the provider.
          This is the provider's stable user ID, not a credential.
        readOnly: true
      display_name:
        type: string
        description: Display name as returned by the provider at last authentication.
        readOnly: true
      email:
        type: string
        description: E-mail address as returned by the provider at last authentication.
        readOnly: true
      last_authenticated_time:
        type: string
        format: date-time
        description: Timestamp of the most recent successful authentication via this identity.
        readOnly: true
      create_time:
        type: string
        format: date-time
        description: Timestamp when this identity was first linked.
        readOnly: true
    description: |-
      UserIdentity is a read-only record of an OAuth2 / SSO connection linked to a
      user.
  v1UserSettings:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the user settings.
          Format: users/{user}/settings
        readOnly: true
      locale:
        type: string
        description: Preferred locale/language tag (e.g. "de-DE").
      theme:
        type: string
        description: 'Preferred UI theme: "light", "dark", or "system".'
      update_time:
        type: string
        format: date-time
        description: Last modification timestamp.
        readOnly: true
      etag:
        type: string
        description: Entity tag for optimistic concurrency control.
        readOnly: true
    description: UserSettings holds per-user application preferences.
