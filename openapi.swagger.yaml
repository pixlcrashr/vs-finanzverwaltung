        - name: assignment
          description: The assignment to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              uid:
                type: string
                description: The UUID of the assignment.
                readOnly: true
              accountGroup:
                type: string
                title: |-
                  The resource name of the parent account group.
                  Format: accountGroups/{account_group}
                readOnly: true
              accountId:
                type: string
                description: The UUID of the assigned account.
              negate:
                type: boolean
                description: If true, this account is excluded (negated) from the group aggregate.
              updateTime:
                type: string
                format: date-time
                description: Last modification timestamp.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Creation timestamp.
                readOnly: true
            title: The assignment to update.
            required:
              - accountId
      tags:
        - AccountGroupAssignmentService
  /v1/{budget.name}:
