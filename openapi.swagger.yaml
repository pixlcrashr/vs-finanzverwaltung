    default: PERMISSION_UNSPECIFIED
    description: |-
      Permission enumerates every discrete access right in the system.
      Each value encodes a resource and an action, following the convention
      RESOURCE_ACTION (all upper-snake-case).

       - PERMISSION_DASHBOARD_READ: Dashboard
       - PERMISSION_ACCOUNTS_READ: Accounts
       - PERMISSION_ACCOUNT_GROUPS_READ: Account Groups
       - PERMISSION_BUDGETS_READ: Budgets / Plans
       - PERMISSION_JOURNAL_READ: Journal
       - PERMISSION_LEDGER_ACCOUNT_READ: Ledger Accounts
       - PERMISSION_LEDGER_YEAR_READ: Ledger Years
