[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _
g2 = _, _
g3 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g2(r.sub, p.sub) && (g3(p.sub, r.dom) || g3(p.sub, "*")) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
