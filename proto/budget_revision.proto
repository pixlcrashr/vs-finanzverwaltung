syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// BudgetRevision is a read-only, point-in-time capture of a Budget's full set
// of BudgetAccountValues. Revisions are immutable after creation and cannot be
// rolled back to. The captured account values are accessible as a paginated
// sub-collection via BudgetRevisionAccountValueService. See AIP-162.
message BudgetRevision {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/BudgetRevision"
    pattern: "organizations/{organization}/budgets/{budget}/revisions/{revision}"
  };

  // The resource name of the revision.
  // Format: organizations/{organization}/budgets/{budget}/revisions/{revision}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the revision.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The resource name of the parent budget.
  // Format: organizations/{organization}/budgets/{budget}
  string budget = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];

  // Human-readable name for this revision.
  string display_name = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional free-text description for this revision.
  string display_description = 5 [(google.api.field_behavior) = OPTIONAL];

  // The date this revision represents.
  google.type.Date date = 6 [(google.api.field_behavior) = OPTIONAL];

  // Timestamp when this revision was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetBudgetRevisionRequest {
  // The resource name of the budget revision.
  // Format: organizations/{organization}/budgets/{budget}/revisions/{revision}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/BudgetRevision"}
  ];
}

message ListBudgetRevisionsRequest {
  // The parent budget resource name.
  // Format: organizations/{organization}/budgets/{budget}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];

  // Maximum number of revisions to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListBudgetRevisions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression. Defaults to reverse chronological order (create_time desc).
  // Example: "create_time desc", "display_name".
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListBudgetRevisionsResponse {
  // The revisions returned, ordered reverse-chronologically by default.
  repeated BudgetRevision revisions = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of revisions for this budget.
  int64 total_size = 3;
}

message CreateBudgetRevisionRequest {
  // The parent budget resource name.
  // Format: organizations/{organization}/budgets/{budget}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Budget"}
  ];

  // The revision to create. Only display_name and display_description are
  // user-supplied; all other fields are populated by the server.
  BudgetRevision revision = 2 [(google.api.field_behavior) = REQUIRED];
}

// BudgetRevisionService manages read-only revision history for budgets.
// Revisions are created on demand and capture the full set of
// BudgetAccountValues at the time of creation. Revisions are immutable.
service BudgetRevisionService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single budget revision by resource name.
  rpc GetBudgetRevision(GetBudgetRevisionRequest) returns (BudgetRevision) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/budgets/*/revisions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists revisions for a budget in reverse chronological order.
  rpc ListBudgetRevisions(ListBudgetRevisionsRequest) returns (ListBudgetRevisionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/budgets/*}/revisions"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new revision by capturing the current state of all
  // BudgetAccountValues for the given budget.
  rpc CreateBudgetRevision(CreateBudgetRevisionRequest) returns (BudgetRevision) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/budgets/*}/revisions"
      body: "revision"
    };
    option (google.api.method_signature) = "parent,revision";
  }
}
