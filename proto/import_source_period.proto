syntax = "proto3";

package pixlcrashr.vsfv.v1;

option go_package = "github.com/pixlcrashr/vsfv/pkg/api/grpc/gen";
option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ImportSourcePeriod represents a fiscal year period within an import source.
message ImportSourcePeriod {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/ImportSourcePeriod"
    pattern: "organizations/{organization}/importSources/{import_source}/periods/{period}"
  };

  // The resource name of the period.
  // Format: organizations/{organization}/importSources/{import_source}/periods/{period}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the period.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The resource name of the parent import source.
  // Format: organizations/{organization}/importSources/{import_source}
  string import_source = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSource"}
  ];

  // The fiscal year this period covers.
  int32 year = 4 [(google.api.field_behavior) = REQUIRED];

  // Whether this period is closed for new imports.
  bool is_closed = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetImportSourcePeriodRequest {
  // The resource name of the period.
  // Format: organizations/{organization}/importSources/{import_source}/periods/{period}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSourcePeriod"}
  ];
}

message ListImportSourcePeriodsRequest {
  // The parent import source resource name.
  // Format: organizations/{organization}/importSources/{import_source}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSource"}
  ];

  // Maximum number of periods to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListImportSourcePeriods call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: year, is_closed.
  // Example: "is_closed=false" or "year=2025".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "year desc", "create_time").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListImportSourcePeriodsResponse {
  // The periods returned.
  repeated ImportSourcePeriod periods = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of periods matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateImportSourcePeriodRequest {
  // The parent import source resource name.
  // Format: organizations/{organization}/importSources/{import_source}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSource"}
  ];

  // The period to create.
  ImportSourcePeriod period = 2 [(google.api.field_behavior) = REQUIRED];
}

message CloseImportSourcePeriodRequest {
  // The resource name of the period to close.
  // Format: organizations/{organization}/importSources/{import_source}/periods/{period}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSourcePeriod"}
  ];
}

message DeleteImportSourcePeriodRequest {
  // The resource name of the period.
  // Format: organizations/{organization}/importSources/{import_source}/periods/{period}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSourcePeriod"}
  ];
}

// ImportSourcePeriodService manages fiscal year periods within an import source.
service ImportSourcePeriodService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single period by resource name.
  rpc GetImportSourcePeriod(GetImportSourcePeriodRequest) returns (ImportSourcePeriod) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/importSources/*/periods/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists periods for an import source.
  rpc ListImportSourcePeriods(ListImportSourcePeriodsRequest) returns (ListImportSourcePeriodsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*/importSources/*}/periods"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a new period.
  rpc CreateImportSourcePeriod(CreateImportSourcePeriodRequest) returns (ImportSourcePeriod) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/importSources/*}/periods"
      body: "period"
    };
    option (google.api.method_signature) = "parent,period";
  }

  // Closes a period, preventing new imports.
  rpc CloseImportSourcePeriod(CloseImportSourcePeriodRequest) returns (ImportSourcePeriod) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/importSources/*/periods/*}:close"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Permanently deletes a period.
  rpc DeleteImportSourcePeriod(DeleteImportSourcePeriodRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=organizations/*/importSources/*/periods/*}"
    };
    option (google.api.method_signature) = "name";
  }
}
