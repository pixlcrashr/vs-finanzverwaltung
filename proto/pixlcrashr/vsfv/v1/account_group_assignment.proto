syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// AccountGroupAssignment associates an account with an account group.
message AccountGroupAssignment {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/AccountGroupAssignment"
    pattern: "organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}"
  };

  // The resource name of the assignment.
  // Format: organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the assignment.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // The resource name of the parent account group.
  // Format: organizations/{organization}/accountGroups/{account_group}
  string account_group = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/AccountGroup"}
  ];

  // The UUID of the assigned account.
  string account_id = 4 [(google.api.field_behavior) = REQUIRED];

  // If true, this account is excluded (negated) from the group aggregate.
  bool negate = 5 [(google.api.field_behavior) = OPTIONAL];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetAccountGroupAssignmentRequest {
  // The resource name of the assignment.
  // Format: organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/AccountGroupAssignment"}
  ];
}

message ListAccountGroupAssignmentsRequest {
  // The parent account group resource name.
  // Format: organizations/{organization}/accountGroups/{account_group}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/AccountGroup"}
  ];

  // Maximum number of assignments to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListAccountGroupAssignments call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: account_id, negate.
  // Example: "negate=true" or "account_id=\"<uuid>\"".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "create_time desc").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListAccountGroupAssignmentsResponse {
  // The assignments returned.
  repeated AccountGroupAssignment assignments = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of assignments matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateAccountGroupAssignmentRequest {
  // The parent account group resource name.
  // Format: organizations/{organization}/accountGroups/{account_group}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/AccountGroup"}
  ];

  // The assignment to create.
  AccountGroupAssignment assignment = 2 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the assignment. If not provided, a system-generated UUID
  // will be used. Must be unique within the parent account group.
  string account_group_assignment_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateAccountGroupAssignmentRequest {
  // The assignment to update.
  AccountGroupAssignment assignment = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteAccountGroupAssignmentRequest {
  // The resource name of the assignment.
  // Format: organizations/{organization}/accountGroups/{account_group}/assignments/{assignment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/AccountGroupAssignment"}
  ];
}

// AccountGroupAssignmentService manages account memberships within account groups.
service AccountGroupAssignmentService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single assignment by resource name.
  // Authorization:
  //   Scope: accountGroups:read
  //   Permission: accountGroups:read
  //   Domain: organization-scoped
  rpc GetAccountGroupAssignment(GetAccountGroupAssignmentRequest) returns (AccountGroupAssignment) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/accountGroups/*/assignments/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists assignments for an account group.
  // Authorization:
  //   Scope: accountGroups:read
  //   Permission: accountGroups:read
  //   Domain: organization-scoped
  rpc ListAccountGroupAssignments(ListAccountGroupAssignmentsRequest) returns (ListAccountGroupAssignmentsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/accountGroups/*}/assignments"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new assignment.
  // Authorization:
  //   Scope: accountGroups:write
  //   Permission: accountGroups:create
  //   Domain: organization-scoped
  rpc CreateAccountGroupAssignment(CreateAccountGroupAssignmentRequest) returns (AccountGroupAssignment) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/accountGroups/*}/assignments"
      body: "assignment"
    };
    option (google.api.method_signature) = "parent,assignment,account_group_assignment_id";
  }

  // Updates an existing assignment.
  // Authorization:
  //   Scope: accountGroups:write
  //   Permission: accountGroups:update
  //   Domain: organization-scoped
  rpc UpdateAccountGroupAssignment(UpdateAccountGroupAssignmentRequest) returns (AccountGroupAssignment) {
    option (google.api.http) = {
      patch: "/v1/{assignment.name=organizations/*/accountGroups/*/assignments/*}"
      body: "assignment"
    };
    option (google.api.method_signature) = "assignment,update_mask";
  }

  // Permanently deletes an assignment.
  // Authorization:
  //   Scope: accountGroups:write
  //   Permission: accountGroups:delete
  //   Domain: organization-scoped
  rpc DeleteAccountGroupAssignment(DeleteAccountGroupAssignmentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/accountGroups/*/assignments/*}"};
    option (google.api.method_signature) = "name";
  }
}
