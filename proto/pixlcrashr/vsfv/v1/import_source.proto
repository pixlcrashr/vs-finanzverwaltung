syntax = "proto3";

package pixlcrashr.vsfv.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// ImportSource represents an external data source from which transactions are imported.
message ImportSource {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/ImportSource"
    pattern: "organizations/{organization}/importSources/{import_source}"
  };

  // The resource name of the import source.
  // Format: organizations/{organization}/importSources/{import_source}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the import source.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info) = {format: UUID4}
  ];

  // Human-readable import source name.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional free-text description.
  string display_description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Period start date for this import source.
  google.type.Date period_start = 5 [(google.api.field_behavior) = REQUIRED];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag for optimistic concurrency control.
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetImportSourceRequest {
  // The resource name of the import source.
  // Format: organizations/{organization}/importSources/{import_source}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSource"}
  ];
}

message ListImportSourcesRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Maximum number of import sources to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListImportSources call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: display_name.
  // Example: "display_name=\"BankXY\"".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "display_name", "create_time desc").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListImportSourcesResponse {
  // The import sources returned.
  repeated ImportSource import_sources = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of import sources matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateImportSourceRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The import source to create.
  ImportSource import_source = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateImportSourceRequest {
  // The import source to update.
  ImportSource import_source = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteImportSourceRequest {
  // The resource name of the import source.
  // Format: organizations/{organization}/importSources/{import_source}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/ImportSource"}
  ];
}

// ImportSourceService manages external import sources.
service ImportSourceService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single import source by resource name.
  rpc GetImportSource(GetImportSourceRequest) returns (ImportSource) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/importSources/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists import sources with pagination.
  rpc ListImportSources(ListImportSourcesRequest) returns (ListImportSourcesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/importSources"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a new import source.
  rpc CreateImportSource(CreateImportSourceRequest) returns (ImportSource) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/importSources"
      body: "import_source"
    };
    option (google.api.method_signature) = "parent,import_source";
  }

  // Updates an existing import source.
  rpc UpdateImportSource(UpdateImportSourceRequest) returns (ImportSource) {
    option (google.api.http) = {
      patch: "/v1/{import_source.name=organizations/*/importSources/*}"
      body: "import_source"
    };
    option (google.api.method_signature) = "import_source,update_mask";
  }

  // Permanently deletes an import source.
  rpc DeleteImportSource(DeleteImportSourceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/importSources/*}"};
    option (google.api.method_signature) = "name";
  }
}
