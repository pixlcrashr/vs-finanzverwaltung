syntax = "proto3";

package pixlcrashr.vsfv.v1;

option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";
option go_package = "github.com/pixlcrashr/vsfv/pkg/grpc/gen";

// Permission enumerates every discrete access right in the system.
// Each value encodes a resource and an action, following the convention
// RESOURCE_ACTION (all upper-snake-case).
enum Permission {
  PERMISSION_UNSPECIFIED = 0;

  // Dashboard
  PERMISSION_DASHBOARD_READ = 1;

  // Accounts
  PERMISSION_ACCOUNTS_READ   = 10;
  PERMISSION_ACCOUNTS_CREATE = 11;
  PERMISSION_ACCOUNTS_UPDATE = 12;
  PERMISSION_ACCOUNTS_DELETE = 13;

  // Account Groups
  PERMISSION_ACCOUNT_GROUPS_READ   = 20;
  PERMISSION_ACCOUNT_GROUPS_CREATE = 21;
  PERMISSION_ACCOUNT_GROUPS_UPDATE = 22;
  PERMISSION_ACCOUNT_GROUPS_DELETE = 23;

  // Budgets / Plans
  PERMISSION_BUDGETS_READ   = 30;
  PERMISSION_BUDGETS_CREATE = 31;
  PERMISSION_BUDGETS_UPDATE = 32;
  PERMISSION_BUDGETS_DELETE = 33;

  // Journal
  PERMISSION_JOURNAL_READ   = 40;
  PERMISSION_JOURNAL_IMPORT = 41;

  // Transactions
  PERMISSION_TRANSACTIONS_READ   = 50;
  PERMISSION_TRANSACTIONS_UPDATE = 51;
  PERMISSION_TRANSACTIONS_DELETE = 52;

  // Matrix
  PERMISSION_MATRIX_READ   = 60;
  PERMISSION_MATRIX_UPDATE = 61;

  // Reports
  PERMISSION_REPORTS_READ   = 70;
  PERMISSION_REPORTS_CREATE = 71;
  PERMISSION_REPORTS_DELETE = 72;

  // Report Templates
  PERMISSION_REPORT_TEMPLATES_READ   = 80;
  PERMISSION_REPORT_TEMPLATES_CREATE = 81;
  PERMISSION_REPORT_TEMPLATES_UPDATE = 82;
  PERMISSION_REPORT_TEMPLATES_DELETE = 83;

  // Import Sources
  PERMISSION_IMPORT_SOURCES_READ   = 90;
  PERMISSION_IMPORT_SOURCES_CREATE = 91;
  PERMISSION_IMPORT_SOURCES_UPDATE = 92;

  // Users
  PERMISSION_USERS_READ   = 100;
  PERMISSION_USERS_UPDATE = 101;

  // Groups
  PERMISSION_GROUPS_READ   = 110;
  PERMISSION_GROUPS_CREATE = 111;
  PERMISSION_GROUPS_UPDATE = 112;
  PERMISSION_GROUPS_DELETE = 113;

  // Settings
  PERMISSION_SETTINGS_READ   = 120;
  PERMISSION_SETTINGS_UPDATE = 121;
}
