syntax = "proto3";

package pixlcrashr.vsfv.v1;

option go_package = "github.com/pixlcrashr/vsfv/pkg/api/grpc/gen";
option csharp_namespace = "Pixlcrashr.Vsfv.Sdk.V1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// TransactionAccount is an external account from an import source
// (e.g. a bank account) involved in transactions.
message TransactionAccount {
  option (google.api.resource) = {
    type: "vsfv.pixlcrashr.dev/TransactionAccount"
    pattern: "organizations/{organization}/transactionAccounts/{transaction_account}"
  };

  // The resource name of the transaction account.
  // Format: organizations/{organization}/transactionAccounts/{transaction_account}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The UUID of the transaction account.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Unique account code (e.g. IBAN or internal code).
  string code = 3 [(google.api.field_behavior) = REQUIRED];

  // UUID of the import source this account belongs to.
  string import_source_id = 4 [(google.api.field_behavior) = REQUIRED];

  // Human-readable name.
  string display_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional free-text description.
  string display_description = 6 [(google.api.field_behavior) = OPTIONAL];

  // Last modification timestamp.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetTransactionAccountRequest {
  // The resource name of the transaction account.
  // Format: organizations/{organization}/transactionAccounts/{transaction_account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/TransactionAccount"}
  ];
}

message ListTransactionAccountsRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // Maximum number of accounts to return. The service may return fewer.
  // If unspecified, at most 20 are returned. Maximum value is 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A page token from a previous ListTransactionAccounts call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression conforming to AIP-160.
  // Supported fields: import_source_id, code, display_name.
  // Example: "import_source_id=\"<uuid>\"" or "code:\"IBAN\"".
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Order by expression (e.g. "code", "display_name", "create_time desc").
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListTransactionAccountsResponse {
  // The transaction accounts returned.
  repeated TransactionAccount transaction_accounts = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Total number of accounts matching the filter (may be an estimate).
  int64 total_size = 3;
}

message CreateTransactionAccountRequest {
  // The parent organization resource name.
  // Format: organizations/{organization}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/Organization"}
  ];

  // The transaction account to create.
  TransactionAccount transaction_account = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateTransactionAccountRequest {
  // The transaction account to update.
  TransactionAccount transaction_account = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteTransactionAccountRequest {
  // The resource name of the transaction account.
  // Format: organizations/{organization}/transactionAccounts/{transaction_account}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vsfv.pixlcrashr.dev/TransactionAccount"}
  ];
}

// TransactionAccountService manages external transaction accounts from import sources.
service TransactionAccountService {
  option (google.api.default_host) = "vsfv.pixlcrashr.dev";

  // Gets a single transaction account by resource name.
  rpc GetTransactionAccount(GetTransactionAccountRequest) returns (TransactionAccount) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/transactionAccounts/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists transaction accounts with pagination.
  rpc ListTransactionAccounts(ListTransactionAccountsRequest) returns (ListTransactionAccountsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*}/transactionAccounts"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a new transaction account.
  rpc CreateTransactionAccount(CreateTransactionAccountRequest) returns (TransactionAccount) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/transactionAccounts"
      body: "transaction_account"
    };
    option (google.api.method_signature) = "parent,transaction_account";
  }

  // Updates an existing transaction account.
  rpc UpdateTransactionAccount(UpdateTransactionAccountRequest) returns (TransactionAccount) {
    option (google.api.http) = {
      patch: "/v1/{transaction_account.name=organizations/*/transactionAccounts/*}"
      body: "transaction_account"
    };
    option (google.api.method_signature) = "transaction_account,update_mask";
  }

  // Permanently deletes a transaction account.
  rpc DeleteTransactionAccount(DeleteTransactionAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=organizations/*/transactionAccounts/*}"
    };
    option (google.api.method_signature) = "name";
  }
}
